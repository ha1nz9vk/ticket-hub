name: TicketHub CI

on:
  push:
    branches:
      - unstable
      - stable
  pull_request:
    branches:
      - unstable
      - stable

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tickethub
          POSTGRES_PASSWORD: tickethub_secret
          POSTGRES_DB: tickethub_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tickethub:tickethub_secret@localhost:5432/tickethub_dev
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: tickethub-super-secret-development-jwt-key-2026-min-32-chars
      ED25519_PRIVATE_KEY: MC4CAQAwBQYDK2VwBCIEIFXdummyed25519privatekeydevelopmentonly2026=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @tickethub/shared build

      - name: Check lint
        run: pnpm lint

      - name: Run database migrations and seed
        run: |
          pnpm --filter @tickethub/api db:migrate
          pnpm --filter @tickethub/api db:seed

      - name: Run tests
        run: pnpm test

      - name: Build monorepo
        run: pnpm build

      - name: Build Docker image
        run: docker build -t tickethub-api:ci .

  publish:
    name: Publish Docker image to GHCR
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/unstable'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ha1nz9vk/ticket-hub-api:unstable
            ghcr.io/ha1nz9vk/ticket-hub-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ha1nz9vk/ticket-hub
